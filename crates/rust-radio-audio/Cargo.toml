[package]
name = "rust-radio-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "云听电台音频引擎：内置解码（fdk-aac/symphonia）+ cpal 输出，直播/回听统一状态机"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
cpal = "0.18"
ringbuf = "0.5"
rust-radio-core = { path = "../rust-radio-core" }
reqwest.workspace = true
fdk-aac-sys = "0.5"
symphonia = { version = "0.6", default-features = false, features = ["isomp4", "mp3", "opt-simd"] }
m3u8-rs = "6"
rubato = { version = "5.0", default-features = false }  # 只用异步 sinc，不需要 fft_resampler

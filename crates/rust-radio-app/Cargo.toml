[package]
name = "rust-radio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "云听电台桌面客户端"

[dependencies]
rust-radio-core = { path = "../rust-radio-core" }
rust-radio-audio = { path = "../rust-radio-audio" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.37"
reqwest.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[[bin]]
name = "rust-radio"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[package.metadata.packager]
product-name = "云听电台"
identifier = "com.hex.rust-radio"
description = "非官方云听电台桌面客户端"
category = "Music"
out-dir = "../../dist"
icons = ["assets/app-icon-1024@2x.png"]
binaries-dir = "../../target/release"
binaries = [{ path = "rust-radio", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
signing-identity = "-"
info-plist-path = "../../packaging/macos/Info.plist"

[package.metadata.packager.deb]
package-name = "rust-radio"
depends = ["libasound2 | libasound2t64", "libxkbcommon0", "libwayland-client0", "libgl1"]
section = "sound"
priority = "optional"
desktop-template = "../../packaging/linux/rust-radio.desktop.hbs"

[package.metadata.packager.nsis]
languages = ["SimpChinese", "English"]
installer-mode = "currentUser"
appdata-paths = ["$LOCALAPPDATA\\rust-radio"]

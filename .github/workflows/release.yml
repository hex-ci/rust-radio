name: Release

# 发版：推送 v* tag 自动构建三平台安装包并创建 GitHub Release。
# 也可用 workflow_dispatch 手动跑（tag 必须已存在），发布开关可关掉只取 artifacts。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布用的 tag（如 v0.1.0，需与 Cargo.toml 版本一致）"
        required: true
        type: string
      draft:
        description: "以草稿形式创建 Release"
        required: false
        type: boolean
        default: false
      publish:
        description: "创建 / 更新 GitHub Release（关掉则只构建并保留 artifacts）"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  meta:
    name: 版本校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取 workspace 版本并校验 tag
        id: version
        shell: bash
        env:
          REF_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::无法从 Cargo.toml 的 [workspace.package] 读取 version"
            exit 1
          fi
          if [ "${REF_TAG#v}" != "$version" ]; then
            echo "::error::tag ${REF_TAG} 与 Cargo.toml 版本 ${version} 不一致：先改 workspace.package.version 再打 tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "发布版本 v$version"

  checks:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-checks

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  macos:
    name: macOS DMG（通用二进制）
    runs-on: macos-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos

      - name: 安装 cargo-packager
        run: cargo install cargo-packager --locked

      - name: 构建双架构并合成通用二进制
        run: |
          set -euo pipefail
          cargo build --release --locked -p rust-radio-app --target aarch64-apple-darwin
          cargo build --release --locked -p rust-radio-app --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/rust-radio \
            target/x86_64-apple-darwin/release/rust-radio \
            -output target/release/rust-radio
          lipo -info target/release/rust-radio

      - name: 打包 DMG
        run: cargo packager -p rust-radio-app --release --formats dmg --target universal-apple-darwin

      - name: 校验 DMG 内容
        run: |
          set -euo pipefail
          dmg="$(ls dist/*_universal.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint "$mnt"
          app="$mnt/云听电台.app"
          test -d "$app"
          lipo -info "$app/Contents/MacOS/rust-radio"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${{ needs.meta.outputs.version }}"
          hdiutil detach "$mnt"
          mv "$dmg" "dist/rust-radio_${{ needs.meta.outputs.version }}_macos_universal.dmg"
          ls -lh dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/rust-radio_*_macos_universal.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: 安装 cargo-packager
        run: cargo install cargo-packager --locked

      - name: 构建
        run: cargo build --release --locked -p rust-radio-app

      - name: 打包 NSIS 安装器
        run: cargo packager -p rust-radio-app --release --formats nsis

      - name: 校验并重命名
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "没有生成 NSIS 安装包" }
          if ($installer.Length -lt 1MB) { throw "安装包体积异常：$($installer.Length) 字节" }
          $target = "dist/rust-radio_${{ needs.meta.outputs.version }}_windows_x64_setup.exe"
          Move-Item $installer.FullName $target
          Get-FileHash $target -Algorithm SHA256 | Format-List
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/rust-radio_*_windows_x64_setup.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux deb + AppImage
    # 22.04 的 glibc 2.35 作为基线，比 ubuntu-latest（24.04 / glibc 2.39）兼容更老的发行版
    runs-on: ubuntu-22.04
    needs: meta
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - name: 安装 cargo-packager
        run: cargo install cargo-packager --locked

      - name: 构建
        run: cargo build --release --locked -p rust-radio-app

      - name: 安装 cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: 打包 deb 与 AppImage
        env:
          NO_STRIP: "1"
        run: cargo packager -p rust-radio-app --release --formats deb,appimage

      - name: 生成 RPM
        run: |
          set -euo pipefail
          cargo generate-rpm -p crates/rust-radio-app --auto-req builtin \
            -o "dist/rust-radio_${{ needs.meta.outputs.version }}_linux_amd64.rpm"

      - name: 校验产物
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm
          deb="$(ls dist/*.deb)"
          appimage="$(ls dist/*.AppImage)"
          rpmfile="$(ls dist/*.rpm)"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E "usr/bin/rust-radio|applications/rust-radio.desktop"
          test -x "$appimage"
          file "$appimage"
          rpm -qpi "$rpmfile"
          rpm -qp --requires "$rpmfile"
          rpm2cpio "$rpmfile" | cpio -t | grep -E "usr/bin/rust-radio|applications/rust-radio.desktop"
          mv "$deb" "dist/rust-radio_${{ needs.meta.outputs.version }}_linux_amd64.deb"
          mv "$appimage" "dist/rust-radio_${{ needs.meta.outputs.version }}_linux_amd64.AppImage"
          ls -lh dist/*.deb dist/*.AppImage dist/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/rust-radio_*_linux_amd64.deb
            dist/rust-radio_*_linux_amd64.AppImage
            dist/rust-radio_*_linux_amd64.rpm
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [meta, checks, macos, windows, linux]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          ls -lh
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 生成发布说明
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          sed "s|{{VERSION}}|${VERSION}|g" .github/release-notes.md > release-notes.md

          echo "" >> release-notes.md
          echo "## 本次变更" >> release-notes.md
          echo "" >> release-notes.md
          if prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null)"; then
            echo "自 ${prev} 起：" >> release-notes.md
            echo "" >> release-notes.md
            git log --no-merges --pretty=format:'- %s (%h)' "${prev}..${TAG}" >> release-notes.md
          else
            git log --no-merges --pretty=format:'- %s (%h)' "${TAG}" >> release-notes.md
          fi
          echo "" >> release-notes.md
          sed -n '1,12p' release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: 云听电台 ${{ needs.meta.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.dmg
            artifacts/*_windows_x64_setup.exe
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt
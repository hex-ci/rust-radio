name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev

      # 读 rust-toolchain.toml，装的就是仓库钉住的版本（自带 Swatinem 缓存）
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build app (release)
        run: cargo build --release --locked -p rust-radio-app

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

# 发版脚本别等到打 tag 才发现坏了：这里只打包、不发布。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cargo packager -p rust-radio-app --release --formats dmg
          dmg="$(ls dist/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint "$mnt"
          codesign --verify --deep --strict "$mnt/云听电台.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$mnt/云听电台.app/Contents/Info.plist"
          hdiutil detach "$mnt"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo packager -p rust-radio-app --release --formats nsis
          if (-not (Get-ChildItem dist/*-setup.exe)) { throw "没有生成 NSIS 安装包" }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo install cargo-generate-rpm --locked
          cargo packager -p rust-radio-app --release --formats deb,appimage
          cargo generate-rpm -p crates/rust-radio-app --auto-req builtin -o dist/
          dpkg-deb -I "$(ls dist/*.deb)"
          test -x "$(ls dist/*.AppImage)"
          test -s "$(ls dist/*.rpm)"
